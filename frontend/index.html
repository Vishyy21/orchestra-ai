<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ORCHESTRA AI — Autonomous Multi-Agent Intelligence Platform</title>
    <meta name="description" content="Orchestra AI is an intelligent multi-agent platform where specialized AI agents collaborate to plan, research, analyze, verify and execute complex workflows. Intelligence in Sync. Execution in Motion." />
    <!-- Google Fonts: DM Serif Display, Manrope, IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var urlTheme = params.get('theme');
          var saved = localStorage.getItem('orchestra-theme');
          var theme = urlTheme || saved || 'dark';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.add('light', 'light-theme');
            root.classList.remove('dark', 'dark-theme');
            root.setAttribute('data-theme', 'light');
          } else {
            root.classList.add('dark', 'dark-theme');
            root.classList.remove('light', 'light-theme');
            root.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased min-h-screen selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
