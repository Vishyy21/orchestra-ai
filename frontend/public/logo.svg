<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="orchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer orbital orchestration polygon -->
  <polygon points="24,4 42,14 42,34 24,44 6,34 6,14" stroke="#1F273B" stroke-width="2" fill="#0E121B" />
  
  <!-- Network Synaptic Mesh Links -->
  <line x1="24" y1="12" x2="36" y2="24" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="36" y1="24" x2="24" y2="36" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="24" y1="36" x2="12" y2="24" stroke="#8B5CF6" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="12" y1="24" x2="24" y2="12" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Cross mesh conductors -->
  <line x1="12" y1="24" x2="36" y2="24" stroke="url(#orchGrad)" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8" />
  <line x1="24" y1="12" x2="24" y2="36" stroke="url(#orchGrad)" stroke-width="1.5" stroke-dasharray="2 2" stroke-opacity="0.8" />
  
  <!-- 4 Specialized Agent Nodes (Planner, Researcher, Coder, Verifier) -->
  <circle cx="24" cy="12" r="3.5" fill="#8B5CF6" filter="url(#glow)" />
  <circle cx="36" cy="24" r="3.5" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="24" cy="36" r="3.5" fill="#10B981" filter="url(#glow)" />
  <circle cx="12" cy="24" r="3.5" fill="#A855F7" filter="url(#glow)" />
  
  <!-- Central Core Conductor Node -->
  <circle cx="24" cy="24" r="4.5" fill="url(#orchGrad)" />
  <circle cx="24" cy="24" r="2" fill="#FFFFFF" />
</svg>
